<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>松間亭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2f33;--paper:#ece6da}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:'Noto Serif TC',serif;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
body.night{--ink:#e6e1d6}
#title{position:fixed;left:max(24px,env(safe-area-inset-left));top:max(26px,env(safe-area-inset-top));writing-mode:vertical-rl;pointer-events:none;color:var(--ink);transition:color 1.2s}
#title h1{font-size:34px;letter-spacing:12px;margin:0 0 0 12px;font-weight:600}
#title p{font-size:13px;letter-spacing:5px;margin:4px 0 0;opacity:.68}
#seal{display:inline-block;margin-top:14px;writing-mode:horizontal-tb;width:24px;height:24px;line-height:24px;text-align:center;background:#a8322a;color:#f4ede1;font-size:15px;border-radius:3px}
#foot{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:3px;opacity:.5;color:var(--ink);pointer-events:none;transition:color 1.2s}
#panel{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:212px;background:rgba(250,247,240,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(60,50,40,.15);border-radius:12px;font-size:13px;color:#2b2f33;overflow:hidden;transition:width .3s}
#panel.closed{width:44px}
#panel.closed .body{display:none}
#toggle{all:unset;display:flex;align-items:center;justify-content:center;width:44px;height:40px;cursor:pointer}
#panel:not(.closed) #toggle{width:100%;justify-content:flex-end;padding-right:16px;box-sizing:border-box}
.body{padding:0 16px 14px}
.row{margin:10px 0}
.row .lab{display:flex;justify-content:space-between;margin-bottom:4px}
.row .lab span:last-child{opacity:.6}
input[type=range]{width:100%;accent-color:#8b2a20}
.chk{display:flex;align-items:center;gap:8px;margin:9px 0}
.chk input{accent-color:#8b2a20;width:16px;height:16px}
#reset{all:unset;display:block;margin-top:10px;text-align:center;padding:7px 0;border:1px solid rgba(60,50,40,.25);border-radius:8px;cursor:pointer;width:100%;box-sizing:border-box}
#seasons{display:flex;gap:6px}#seasons button{all:unset;flex:1;text-align:center;padding:5px 0;border:1px solid rgba(60,50,40,.25);border-radius:7px;cursor:pointer}#seasons button.on{background:#8b2a20;color:#f4ede1;border-color:#8b2a20}
#bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:rgba(252,249,243,.95);border:1px solid rgba(60,50,40,.22);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.5;color:#2b2f33;max-width:220px;pointer-events:none;opacity:0;transition:opacity .35s;white-space:pre-line;letter-spacing:1px}
#bubble:after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid rgba(60,50,40,.22);border-bottom:1px solid rgba(60,50,40,.22);transform:translateX(-50%) rotate(45deg)}
#bubble.show{opacity:1}
</style>
<script type="importmap">

<body>
<div id="title"><h1>松間亭</h1><p>明月松間照，清泉石上流。</p><span id="seal">閒</span></div>
<div id="foot">SONG JIAN TING · 山中小憩</div>
<div id="panel" class="closed">
  <button id="toggle" aria-label="調整"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  <div class="body">
    <div class="row"><div class="lab"><span>時辰</span><span id="tName"></span></div><input type="range" id="tod" min="0" max="24" step="0.05"></div>
    <div class="row"><div class="lab"><span>山嵐</span></div><input type="range" id="fog" min="0" max="1" step="0.01" value="0.5"></div>
    <div class="row"><div class="lab"><span>水流</span></div><input type="range" id="flow" min="0" max="2" step="0.01" value="1"></div>
    <div class="row"><div class="lab"><span>落葉</span></div><input type="range" id="leaf" min="0" max="1" step="0.01" value="0.6"></div>
    <div class="row"><div class="lab"><span>四季</span></div><div id="seasons"><button data-s="0">春</button><button data-s="1">夏</button><button data-s="2">秋</button><button data-s="3">冬</button></div></div>
    <label class="chk"><input type="checkbox" id="spin">慢慢轉</label>
    <label class="chk"><input type="checkbox" id="timeflow">讓時間走</label>
    <button id="reset">回到原位</button>
  </div>
</div>
<div id="bubble"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- 基本 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
const MOBILE = matchMedia('(pointer: coarse)').matches;
let PR = Math.min(devicePixelRatio, MOBILE ? 1.25 : 1.75);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = MOBILE ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ece6da');
scene.fog = new THREE.Fog('#ece6da', 60, 140);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 4;
controls.maxDistance = 110;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotateSpeed = 0.6;
const TARGET = new THREE.Vector3(0, 1.1, 0.4);
const HOME_DIR = new THREE.Vector3(0.3, 0.56, 1).normalize();
function homeDist() { const a = innerWidth / innerHeight; return a >= 1 ? 31 : 31 / Math.max(a, 0.42) * 0.85; }
function resetView() { controls.target.copy(TARGET); camera.position.copy(TARGET).addScaledVector(HOME_DIR, homeDist()); controls.update(); }
resetView();

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(20261014);
const rr = (a, b) => a + (b - a) * R();
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const C = c => new THREE.Color(c);
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...o });
function mesh(geo, material, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; if (parent) parent.add(m); return m;
}
// 兩點之間拉一根圓柱
function limb(parent, a, b, r1, r2, material, seg = 10) {
  const dir = new THREE.Vector3().subVectors(b, a); const len = dir.length();
  const m = mesh(new THREE.CylinderGeometry(r2, r1, len, seg), material, parent);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

// ---------- 四季：0 春 1 夏 2 秋 3 冬，預設跟著現在的月份 ----------
let SEASON = [3, 3, 0, 0, 0, 1, 1, 1, 2, 2, 2, 3][new Date().getMonth()];
const seasonMeshes = [];
const S4 = (a, b, c, d) => [a, b, c, d].map(x => x instanceof THREE.Color ? x : C(x));
const SNOW = C('#eef1f3');
// ---------- 地形 ----------
const HALF = 6.5, BOTTOM = -2.5, WL = 0.35;
const RIPS = 10;
const waterUni = { uIce: { value: 0 }, uClear: { value: 0 }, uRipOn: { value: 0 }, uRip: { value: Array.from({ length: RIPS }, () => new THREE.Vector4(0, 0, -99, 0)) }, uTime: { value: 0 }, uDay: { value: 1 }, uSun: { value: new THREE.Vector3(1, 1, 1) }, uSunCol: { value: new THREE.Color('#fff') }, uSky: { value: new THREE.Color('#ece6da') } };
const PL = { x: 0.2, z: -0.8, h: 2.7 };
const POOL = { x: 2.7, z: 3.9 }; // 魚游的那片水
const SA = { x: -2.55, z: 3.9 }, SB = { x: -1.0, z: 1.35 };

function n2(x, z) { return Math.sin(x * .9 + z * .3) * .5 + Math.sin(z * 1.3 - x * .7) * .35 + Math.sin((x + z) * 2.1) * .15 + Math.sin(x * 3.7) * Math.cos(z * 3.1) * .08; }

  const g = (cx, cz, a, sd) => a * Math.exp(-((x - cx) ** 2 + (z - cz) ** 2) / sd);
  let isl = g(-0.6, -1.6, 4.6, 19) + g(-2.8, -3.6, 3.7, 3.6) + g(2.4, -3.5, 2.3, 3) + g(-3.9, -0.2, 1.4, 3) + g(-1.6, 2.0, 1.4, 2.6) + g(3.5, -0.8, 1.0, 2.5);

  const k = sm(0.7, 2.0, h) * 0.7, st = 0.5 + Math.sin(x * 0.9 - z * 0.6) * 0.05, f = h / st, fl = Math.floor(f);
  h = h * (1 - k) + st * (fl + sm(0.5, 1, f - fl)) * k;
  return h;
}
function shaped(x, z) {
  let h = raw(x, z);
  const w = 1 - sm(2.45, 3.1, Math.hypot(x - PL.x, z - PL.z)); h = h * (1 - w) + PL.h * w;
  return h;
}

  const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (z - a.z) * dz) / L2));
  return { t, d: Math.hypot(x - (a.x + dx * t), z - (a.z + dz * t)) };
}
const hA = WL + 0.16, hB = PL.h;
// 石徑：一條往左繞的彎路，中段一塊歇腳平台
const STAIR_C = { x: -3.45, z: 2.2 };
const stairAt = t => ({ x: (1 - t) ** 2 * SA.x + 2 * (1 - t) * t * STAIR_C.x + t * t * SB.x, z: (1 - t) ** 2 * SA.z + 2 * (1 - t) * t * STAIR_C.z + t * t * SB.z });

function stairProj(x, z) {
  if (x < stairBox.x0 - 1.5 || x > stairBox.x1 + 1.5 || z < stairBox.z0 - 1.5 || z > stairBox.z1 + 1.5) return { t: 0, d: 99 };
  let bd = 1e9, bt = 0;
  for (let i = 0; i < STAIR_N; i++) { const q = segProj(x, z, stairPts[i], stairPts[i + 1]); if (q.d < bd) { bd = q.d; bt = (i + q.t) / STAIR_N; } }
  return { t: bt, d: bd };
}
function stairFrame(t) { const a = stairAt(Math.max(0, t - 0.01)), b = stairAt(Math.min(1, t + 0.01)), p = stairAt(t), dx = b.x - a.x, dz = b.z - a.z, l = Math.hypot(dx, dz); return { x: p.x, z: p.z, tx: dx / l, tz: dz / l, nx: dz / l, nz: -dx / l }; }
const LAND0 = 0.42, LAND1 = 0.56;
const stairG = t => t < LAND0 ? 0.5 * t / LAND0 : t < LAND1 ? 0.5 : 0.5 + 0.5 * (t - LAND1) / (1 - LAND1);
const stepH = t => hA + (hB - hA) * stairG(t);
function hNoStream(x, z) {
  let h = shaped(x, z);
  const s = stairProj(x, z);
  if (s.d < 1.1) { const k = 1 - sm(0.5, 1.1, s.d); h = Math.max(h, h * (1 - k) + (stepH(s.t) - 0.06) * k); }
  return h;
}
// 溪：從山上的泉眼一路下到水池
const streamCurve = new THREE.CatmullRomCurve3([[-2.6, -2.6], [-1.7, -2.5], [-0.5, -3.55], [1.0, -3.75], [2.5, -3.1], [3.45, -1.5], [3.8, 0.4], [4.0, 1.8], [4.4, 2.8]].map(([x, z]) => new THREE.Vector3(x, 0, z)));
const SN = 260;
let run = 1e9;
const sPts = streamCurve.getSpacedPoints(SN).map(p => { const h = hNoStream(p.x, p.z); run = Math.min(run, h); return { x: p.x, z: p.z, h, y: Math.max(run, WL - 0.06) }; });
const sDs0 = streamCurve.getLength() / SN;
sPts.forEach((p, i) => { const a = sPts[Math.max(0, i - 2)], b = sPts[Math.min(SN, i + 2)]; p.slope = (a.y - b.y) / (sDs0 * 4); });
// 溪在島邊的崖口停住，從那裡落成瀑布
let I_LOW = sPts.findIndex((p, i) => i > SN * 0.4 && p.h < WL + 0.05); if (I_LOW < 0) I_LOW = SN;
let I_LIP = I_LOW; while (I_LIP > SN * 0.4 && (sPts[I_LIP].h < sPts[I_LOW].h + 1.2 || sPts[I_LIP].slope > 0.45)) I_LIP--;
const FALL = { x: sPts[I_LOW].x, z: sPts[I_LOW].z };
const sDs = streamCurve.getLength() / SN;
function nearestStream(x, z) {
  let bd = 1e9, bi = 0;
  for (let i = 0; i <= I_LIP; i += 4) { const p = sPts[i], d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < bd) { bd = d; bi = i; } }
  for (let i = Math.max(0, bi - 4); i <= Math.min(I_LIP, bi + 4); i++) { const p = sPts[i], d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < bd) { bd = d; bi = i; } }
  return { d: Math.sqrt(bd), y: sPts[bi].y, i: bi };
}
function heightAt(x, z) {
  let h = hNoStream(x, z);
  const ns = nearestStream(x, z);
  if (ns.d < 1.1) { const k = 1 - sm(0.28, 1.1, ns.d); h = h * (1 - k) + Math.min(h, ns.y - 0.16) * k; }
  return h;
}

const SEG = 100;
{
  const g = new THREE.PlaneGeometry(HALF * 2, HALF * 2, SEG, SEG); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
  g.computeVertexNormals();
  const nor = g.attributes.normal;
  const grassS = [['#9cc06c', '#73944f'], ['#7fa458', '#5c7f43'], ['#a4a560', '#7b7f45'], ['#a4a560', '#7b7f45']].map(a => a.map(C));
  const rock = C('#a68d70'), rockHi = C('#bba78c'), dirt = C('#a8916d'), sand = C('#d3c29c'), wet = C('#5d7650');
  const c = new THREE.Color(), pre = [];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const ao = 1 - Math.min(0.32, Math.max(0, ((heightAt(x + 0.35, z) + heightAt(x - 0.35, z) + heightAt(x, z + 0.35) + heightAt(x, z - 0.35)) / 4 - y) * 0.9));
    pre.push({ x, y, z, ny: nor.getY(i), ns: nearestStream(x, z).d, sd: stairProj(x, z).d, v: (0.92 + 0.16 * (0.5 + 0.5 * Math.sin(x * 7.1 + z * 5.3) * Math.cos(z * 6.7 - x * 2.9))) * ao });
  }
  for (let se = 0; se < 4; se++) {
    const col = new Float32Array(pos.count * 3);
    pre.forEach(({ x, y, z, ny, ns, sd, v }, i) => {
      c.copy(grassS[se][0]).lerp(grassS[se][1], sm(1, 4.5, y));
      c.lerp(rock, sm(0.84, 0.62, ny));
      c.lerp(rockHi, sm(3.8, 5.2, y) * 0.6);
      if (ns < 1.2) c.lerp(wet, (1 - sm(0.3, 1.2, ns)) * 0.6);
      if (sd < 0.9) c.lerp(dirt, (1 - sm(0.4, 0.9, sd)) * 0.8);
      c.lerp(sand, sm(WL + 0.5, WL + 0.1, y));
      c.lerp(C('#b8b39a'), sm(WL - 0.3, WL - 1.4, y) * 0.6);
      c.lerp(C('#c4c8bb'), sm(3.0, 5.5, y) * 0.3);
      if (se === 3) c.lerp(SNOW, sm(0.4, 0.72, ny) * sm(WL + 0.12, WL + 0.4, y) * 0.9);
      col[i * 3] = c.r * v; col[i * 3 + 1] = c.g * v; col[i * 3 + 2] = c.b * v;
    });
    g.setAttribute('cs' + se, new THREE.BufferAttribute(col, 3));
  }
  g.setAttribute('color', g.attributes['cs' + SEASON].clone());
  const t = mesh(g, mat('#fff', { vertexColors: true, roughness: 0.95 }), scene);
  seasonMeshes.push(t);
}
// 側面的岩層，和水池切開的水
{
  const strata = ['#7b6a58', '#8f7c66', '#a18d74', '#6f6052', '#968470', '#82705d'].map(C);
  const M = 8;
  const edges = [
    u => [u, HALF], u => [HALF, -u], u => [-u, -HALF], u => [-HALF, u]
  ];
  const rockPos = [], rockCol = [], rockIdx = [], wPos = [], wIdx = [];
  edges.forEach(f => {
    const base = rockPos.length / 3, wbase = wPos.length / 3;
    for (let i = 0; i <= SEG; i++) {
      const u = -HALF + 2 * HALF * i / SEG; const [x, z] = f(u); const top = heightAt(x, z);
      for (let j = 0; j <= M; j++) {
        const y = BOTTOM + (top - BOTTOM) * j / M;
        rockPos.push(x, y, z);
        let cc;
        if (top - y < 0.22) cc = C('#5d4b3a');
        else { const b = Math.floor((y + 6 + 0.25 * Math.sin(u * 0.8) + 0.1 * Math.sin(u * 3.1)) / 0.48); cc = strata[((b % 6) + 6) % 6].clone(); }
        const v = 0.94 + 0.12 * Math.sin(u * 9.1 + y * 13.7);
        rockCol.push(cc.r * v, cc.g * v, cc.b * v);
      }
      const wb = Math.min(top, WL);
      const ox = x === HALF ? 0.01 : x === -HALF ? -0.01 : 0, oz = z === HALF ? 0.01 : z === -HALF ? -0.01 : 0;
      wPos.push(x + ox, wb, z + oz, x + ox, WL, z + oz);
    }
    for (let i = 0; i < SEG; i++) {
      for (let j = 0; j < M; j++) { const a = base + i * (M + 1) + j, b = a + M + 1; rockIdx.push(a, b, a + 1, b, b + 1, a + 1); }
      const a = wbase + i * 2; wIdx.push(a, a + 2, a + 1, a + 2, a + 3, a + 1);
    }
  });
  const rg = new THREE.BufferGeometry();
  rg.setAttribute('position', new THREE.Float32BufferAttribute(rockPos, 3));
  rg.setAttribute('color', new THREE.Float32BufferAttribute(rockCol, 3));
  rg.setIndex(rockIdx); rg.computeVertexNormals();
  mesh(rg, mat('#fff', { vertexColors: true, roughness: 1, side: THREE.DoubleSide, flatShading: true }), scene);
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wPos, 3)); wg.setIndex(wIdx); wg.computeVertexNormals();
  const wm = new THREE.Mesh(wg, new THREE.ShaderMaterial({ uniforms: waterUni, transparent: true, side: THREE.DoubleSide, depthWrite: false,
    vertexShader: `varying float vY;void main(){vY=position.y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: `uniform float uDay;varying float vY;void main(){float t=clamp((${WL.toFixed(2)}-vY)/2.,0.,1.);
      vec3 c=mix(vec3(.62,.88,.88),vec3(.16,.47,.55),t);float a=mix(.22,.62,t)+smoothstep(.03,0.,${WL.toFixed(2)}-vY)*.5;
      gl_FragColor=vec4(c*mix(.35,1.,uDay),a);}` }));
  scene.add(wm);
  // 底座
  mesh(new THREE.BoxGeometry(HALF * 2 + 0.7, 0.32, HALF * 2 + 0.7), mat('#e3d8c3', { roughness: 0.7 }), scene, 0, BOTTOM - 0.16, 0);
}
// 水盒的玻璃邊
